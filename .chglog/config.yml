# git-chglog configuration. Regenerate the changelog with `task changelog`.
#
# Only release tags are rendered: tag_filter_pattern keeps v* and drops the
# per-module cmd/*/v* tags, and sort: semver requires that filter because
# semver sorting panics on non-version tag names.
style: github

# Resolved relative to this file.
template: CHANGELOG.tpl.md

info:
  title: Changelog
  repository_url: https://github.com/codesjoy/yggdrasil

options:
  tag_filter_pattern: '^v'
  sort: semver

  # Whitelist of Conventional Commits types that reach the changelog. The
  # filter is an exact-match whitelist, so any type not listed here
  # (docs/test/style/build/chore) is dropped entirely.
  commits:
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
#        - ci
#        - revert

  commit_groups:
    title_maps:
      feat: Features
      fix: Fixes
      perf: Perf
      refactor: Refactor
#      ci: CI
#      revert: Reverts

  header:
    # type(scope)!: subject — the bang is optional.
    pattern: '^(\w*)(?:\(([\w$.\-* ]*)\))?!?:\s(.*)$'
    pattern_maps:
      - Type
      - Scope
      - Subject

  notes:
    keywords:
      - BREAKING CHANGE
